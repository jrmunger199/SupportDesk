# Included by every location that serves the Angular app. Proxied locations (/api, /hubs) are deliberately
# left out: the API sets its own headers, and adding them here as well would send each one twice.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Scripts are limited to our own files. Styles allow 'unsafe-inline' because Angular injects component styles
# at runtime; moving to per-request nonces would remove that.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS must be sent over HTTPS, so enable it on the hop that terminates TLS (this container, or the load balancer
# in front of it):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
