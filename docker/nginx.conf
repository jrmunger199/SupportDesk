server {
  listen 8080;
  server_tokens off;      # don't advertise the nginx version
  client_max_body_size 1m; # API payloads are small JSON
  root /usr/share/nginx/html;
  index index.html;

  # Static assets are content-hashed by the Angular build, so they can be cached for a long time.
  location ~* \.(?:js|css|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # The API and the SignalR hub live behind the same origin, so the browser needs no CORS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr; # overwrite, never append: clients must not be able to forge it
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Single-page app: unknown paths fall back to index.html so deep links survive a refresh.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
