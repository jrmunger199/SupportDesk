# Full stack: SQL Server + API + web. Copy .env.example to .env first.
# This is a demo setup: the API connects as "sa" and trusts the server's self-signed certificate. For real use,
# create a least-privilege SQL login and a certificate the API can verify.
#   docker compose up --build
# then open http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - dbdata:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=db;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters)}
      Database__MigrateOnStartup: "true"
      # Demo data is opt-in and off by default. Its accounts have a published password.
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      # Trust X-Forwarded-For only from the private networks Docker uses, i.e. the nginx container in front.
      ForwardedHeaders__TrustedNetworks__0: 10.0.0.0/8
      ForwardedHeaders__TrustedNetworks__1: 172.16.0.0/12
      ForwardedHeaders__TrustedNetworks__2: 192.168.0.0/16

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy # the API image defines its own HEALTHCHECK
    ports:
      - "8080:8080"

volumes:
  dbdata:
